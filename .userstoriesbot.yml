# Showcase fork only (never part of an upstream pull request).
version: 1
app:
  install: "npm ci --ignore-scripts --no-audit --no-fund && CI=true npm run bootstrap -- --scope=web && npm run build:test:web"
  start: "cd apps/web && npx vite preview --port {port} --strictPort --host 0.0.0.0"
  url: http://localhost:{port}
  readyPath: /
  runtime: node22
demo:
  maxVideos: 1
  beforePass: false
